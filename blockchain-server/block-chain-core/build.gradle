plugins {
	id 'java'
	id 'org.springframework.boot' version '2.7.8'
	id 'io.spring.dependency-management' version '1.0.15.RELEASE'
	id 'application'
}


application {
	mainClass = 'blockChain.SpringMongoApplication'

}


group = 'block-chain'
version = '0.0.1-SNAPSHOT'

repositories {
	mavenCentral()
}

dependencies {

	implementation project(path: ':vendor-bundle')
	implementation project(path: ':wallet')
	implementation project(path: ':consensus-middle-ware')

	implementation project(path: ':chiffrement-utils')

	implementation 'org.springframework.boot:spring-boot-starter-data-mongodb'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-websocket'



	implementation group: 'javax.validation', name: 'validation-api', version: '2.0.1.Final'
	implementation group: 'org.apache.httpcomponents', name: 'httpclient', version: '4.5'

	/////////////// communication to nodejs front end ///////////////

	implementation('io.socket:socket.io-client:2.0.0')
    implementation project(path: ':consensus-middle-ware')
}

